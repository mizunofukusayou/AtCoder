version: "3"

tasks:
  default:
    deps: [run]

  run:
    cmd: pbpaste | ./a.out

  init:
    cmds:
      [
        "targets=\"{{.CLI_ARGS}}\"\nif [ -z \"$targets\" ]; then\n  targets=\"a b c d e f g\"\nfi\nfor name in $targets; do\n  cp tmpl.cpp \"${name}.cpp\"\ndone\n",
      ]

  atcoder:
    cmd: open './.docs/AtCoder Library/index.html'

  cpp:
    cmd: open './.docs/cpprefjp/article.html'

  combine:
    desc: "ACLのexpander.pyを使ってヘッダーファイルを展開します"
    summary: |
      引数に指定したC++のソースコードに、.include/ 内のACLを埋め込みます。
      使用例: task combine -- main.cpp
    cmd: python3 .docs/AtCoder\ Library/expander.py {{.CLI_ARGS}} --lib .include

  submodule:
    desc: "Add a git submodule with shallow clone enabled (Usage: task submodule -- <URL> <PATH>)"
    cmd: |
      set -- {{.CLI_ARGS}}
      URL="$1"
      PATH_DIR="$2"

      if [ -z "$URL" ] \vert{}\vert{} [ -z "$PATH_DIR" ]; then
        echo "Error: URL and PATH are required."
        echo "Usage: task submodule -- <URL> <PATH>"
        exit 1
      fi

      git submodule add --depth 1 "$URL" "$PATH_DIR"
      git config -f .gitmodules "submodule.$PATH_DIR.shallow" true
